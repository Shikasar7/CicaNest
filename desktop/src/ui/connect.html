<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <title>连接设置</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="connect.css" />
    <script src="connect.js" defer></script>
  </head>
  <body>
    <div class="drag" aria-hidden="true"></div>
    <main class="panel">
      <h1>nest 在哪里运行</h1>
      <p id="now" class="now"></p>
      <div class="choices" role="radiogroup" aria-label="nest 在哪里运行">
        <label class="choice" id="choice-local">
          <input type="radio" name="mode" value="local" />
          <span>
            <b>在这台电脑上 <span class="tag">大多数人选这个</span></b>
            <small>点「开始使用」就行，不用另装别的。伙伴、聊天记录和密钥都存在这台电脑里，电脑开着她们就在。</small>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="mode" value="remote" />
          <span>
            <b>在另一台电脑上</b>
            <small>只在你已经有一台常开的电脑（Mac、服务器）装好了 nest 时选，这里只连过去。</small>
          </span>
        </label>
      </div>
      <section id="local" hidden>
        <p class="hint">
          数据放在 <span id="home" class="path"></span>，升级和卸载都不会删。以后想换，在任务栏右下角 nest 图标的菜单里选「连接设置…」。
        </p>
      </section>
      <section id="remote" hidden>
        <ol>
          <li>在那台电脑打开 nest 控制台，到「系统」页的「远程访问」</li>
          <li>打开开关，设一个密码，按提示重启 nest</li>
          <li>那里会列出地址，抄一个填在下面；连上后用刚设的密码登录</li>
        </ol>
        <label for="address">nest 的地址</label>
        <input id="address" type="text" spellcheck="false" placeholder="My-Mac.local:18800" autocomplete="off" />
        <p class="hint">两台电脑要在同一个 Wi‑Fi 或路由器下，或者都登录了 Tailscale。</p>
        <details>
          <summary>还有一个地址也能连到它（比如出门用 Tailscale）</summary>
          <label for="other">备用地址</label>
          <input id="other" type="text" spellcheck="false" placeholder="局域网里的名字或 IP" autocomplete="off" />
          <p class="hint">先试上面那个，没有回应再用这个，两个要各登录一次。局域网里是明文 HTTP，在外面用 Tailscale 的名字更安全。</p>
        </details>
      </section>
      <p id="result" class="result" role="status"></p>
      <div class="actions">
        <button class="btn ghost" type="button" id="test" hidden>试试能不能连上</button>
        <span class="spacer"></span>
        <button class="btn primary" type="button" id="save">开始使用</button>
      </div>
    </main>
  </body>
</html>
