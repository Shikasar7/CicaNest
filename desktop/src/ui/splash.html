<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <title>nest</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="splash.css" />
    <script src="splash.js" defer></script>
  </head>
  <body>
    <main class="card" id="card">
      <header class="head">
        <svg class="mark" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true">
          <rect width="32" height="32" rx="8.5" fill="#17202A" />
          <path
            d="M6.5 13.3C6.5 18.8 10.5 21.3 16 21.3S25.5 18.8 25.5 13.3"
            fill="none"
            stroke="#F2F4F5"
            stroke-width="2.4"
            stroke-linecap="round"
          />
          <circle cx="11.6" cy="14.4" r="2.6" fill="#2F7FD0" />
          <circle cx="20.4" cy="14.4" r="2.6" fill="#1E9C82" />
          <circle cx="16" cy="12.2" r="2.6" fill="#E2557F" />
        </svg>
        <div class="brand">
          <div class="wordmark">nest</div>
          <div class="subtitle" id="subtitle" aria-live="polite"></div>
        </div>
        <div class="glyphs" id="glyphs"></div>
      </header>

      <ol class="steps" id="steps"></ol>

      <footer class="foot">
        <p class="message" id="message" role="status"></p>
        <div class="row">
          <span class="footnote"><span class="tag" id="tag" hidden>测试副本</span><span id="footnote"></span></span>
          <div class="actions" id="actions"></div>
        </div>
      </footer>
    </main>
  </body>
</html>
