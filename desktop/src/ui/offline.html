<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <title>nest</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="offline.css" />
    <script src="offline.js" defer></script>
  </head>
  <body>
    <div class="drag" aria-hidden="true"></div>
    <main class="panel">
      <svg class="mark" viewBox="0 0 32 32" width="44" height="44" aria-hidden="true">
        <rect width="32" height="32" rx="8.5" fill="#17202A" />
        <path
          d="M6.5 13.3C6.5 18.8 10.5 21.3 16 21.3S25.5 18.8 25.5 13.3"
          fill="none"
          stroke="#F2F4F5"
          stroke-width="2.4"
          stroke-linecap="round"
        />
        <circle cx="11.6" cy="14.4" r="2.6" fill="#7B858E" />
        <circle cx="20.4" cy="14.4" r="2.6" fill="#7B858E" />
        <circle cx="16" cy="12.2" r="2.6" fill="#7B858E" />
      </svg>
      <h1>nest 后台没有响应</h1>
      <p>bot 现在可能都不在线。后台恢复后，这个窗口会自动重新连上。</p>
      <div class="actions">
        <button class="btn ghost" type="button" id="logs">打开日志文件夹</button>
        <button class="btn primary" type="button" id="restart">重启 nest</button>
      </div>
    </main>
  </body>
</html>
